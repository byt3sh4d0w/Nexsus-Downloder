<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" font-family="Segoe UI, Inter, Arial, sans-serif">
<title>Nexus Downloader architecture</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8b93a1"/></marker></defs>
<rect width="1200" height="620" fill="#0f1115"/>
<style>.l{fill:#171a21;stroke:#2a2f3a;rx:14}.b{fill:#1d212b;stroke:#3a4150;rx:10}.t{fill:#e8eaf0;font-size:15px;font-weight:600}.s{fill:#9aa3b2;font-size:12.5px}.h{fill:#ff9a3c;font-size:12px;font-weight:700;letter-spacing:.08em}.e{stroke:#8b93a1;stroke-width:1.6;fill:none;marker-end:url(#a)}.d{stroke-dasharray:5 4}</style>
<rect class="l" x="20" y="20" width="1160" height="120"/><text class="h" x="40" y="46">GUI · gui/ · PySide6</text>
<rect class="b" x="40" y="60" width="340" height="62"/><text class="t" x="56" y="86">main_window.py</text><text class="s" x="56" y="106">pages, timers, job registry, settings</text>
<rect class="b" x="400" y="60" width="340" height="62"/><text class="t" x="416" y="86">new_download.py</text><text class="s" x="416" y="106">URL entry, file-name probe, conflicts</text>
<rect class="b" x="760" y="60" width="400" height="62"/><text class="t" x="776" y="86">torrent_page / torrent_dialog / network_table</text><text class="s" x="776" y="106">torrent UI, responsive tables</text>
<rect class="l" x="20" y="180" width="1160" height="190"/><text class="h" x="40" y="206">ENGINES · core/</text>
<rect class="b" x="40" y="220" width="250" height="62"/><text class="t" x="56" y="246">security.py</text><text class="s" x="56" y="266">URL + file-name validation</text>
<rect class="b" x="310" y="220" width="250" height="62"/><text class="t" x="326" y="246">downloader.py</text><text class="s" x="326" y="266">HTTP engine · ranges · merge</text>
<rect class="b" x="580" y="220" width="250" height="62"/><text class="t" x="596" y="246">scheduler.py</text><text class="s" x="596" y="266">adaptive range queue</text>
<rect class="b" x="850" y="220" width="310" height="62"/><text class="t" x="866" y="246">network_monitor.py</text><text class="s" x="866" y="266">adapters · TCP probe · rates</text>
<rect class="b" x="40" y="296" width="250" height="62"/><text class="t" x="56" y="322">torrent.py</text><text class="s" x="56" y="342">libtorrent session wrapper</text>
<rect class="b" x="310" y="296" width="250" height="62"/><text class="t" x="326" y="322">cleanup.py</text><text class="s" x="326" y="342">temp-file removal</text>
<rect class="b" x="580" y="296" width="250" height="62"/><text class="t" x="596" y="322">links.py</text><text class="s" x="596" y="342">duplicate detection, free file names</text>
<rect class="l" x="20" y="410" width="760" height="190"/><text class="h" x="40" y="436">LOCAL STORAGE</text>
<rect class="b" x="40" y="450" width="230" height="62"/><text class="t" x="56" y="476">downloads.db</text><text class="s" x="56" y="496">SQLite · database/db.py</text>
<rect class="b" x="290" y="450" width="230" height="62"/><text class="t" x="306" y="476">settings.json</text><text class="s" x="306" y="496">~/NexusDownloader</text>
<rect class="b" x="540" y="450" width="220" height="62"/><text class="t" x="556" y="476">Download folder</text><text class="s" x="556" y="496">.part · .parts · final file</text>
<rect class="b" x="40" y="526" width="480" height="56"/><text class="t" x="56" y="552">Torrent cache</text><text class="s" x="56" y="570">.torrent copies + resume data in ~/NexusDownloader/torrents</text>
<rect class="l" x="820" y="410" width="360" height="190"/><text class="h" x="840" y="436">INTERNET</text>
<rect class="b" x="840" y="450" width="320" height="50"/><text class="t" x="856" y="472">HTTP / HTTPS servers</text><text class="s" x="856" y="490">httpx · TLS verified · bound to adapter IP</text>
<rect class="b" x="840" y="512" width="320" height="38"/><text class="t" x="856" y="536">www.gstatic.com:443 (adapter probe)</text>
<rect class="b" x="840" y="556" width="320" height="34"/><text class="t" x="856" y="578">Peers · trackers · DHT (libtorrent)</text>
<path class="e" d="M600 140V180"/><path class="e" d="M600 370V410"/><path class="e" d="M1000 370V450"/><path class="e d" d="M435 220C435 175 300 160 250 124"/>
<text class="s" x="318" y="164">progress callbacks</text>
</svg>
